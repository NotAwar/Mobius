# Dependabot configuration following current best practices
# Manages dependencies across all package ecosystems in the Mobius MDM platform
#
# Ecosystems covered:
# - GitHub Actions (workflows in .github/workflows/)
# - Docker (all Dockerfiles in the repository)
# - Go modules (6 modules: server/api, server/cli, client/client, cocoon/portal, common/shared)
# - npm (ui/web frontend)
#
# Auto-merge enabled via dependabot-auto-merge.yml workflow:
# - Patch updates: auto-merged
# - Minor dev dependencies: auto-merged
# - Major updates: require manual review

version: 2
updates:
# === GitHub Actions Dependencies ===
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
    time: "09:00"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "github-actions"
  commit-message:
    prefix: "ci"
  pull-request-branch-name:
    separator: "-"

# === Docker Dependencies ===
- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "tuesday"
    time: "09:00"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 5
  labels:
  - "dependencies"
  - "docker"
  commit-message:
    prefix: "docker"
  pull-request-branch-name:
    separator: "-"

# === Go Dependencies - API Server ===
- package-ecosystem: "gomod"
  directory: "/server/api"
  schedule:
    interval: "weekly"
    day: "wednesday"
    time: "09:00"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "go"
  - "server"
  commit-message:
    prefix: "deps(api)"
  pull-request-branch-name:
    separator: "-"
  groups:
    go-security:
      patterns:
      - "golang.org/x/crypto"
      - "golang.org/x/net"
      - "golang.org/x/oauth2"
    go-minor:
      update-types:
      - "minor"
      - "patch"

# === Go Dependencies - CLI Tool ===
- package-ecosystem: "gomod"
  directory: "/server/cli"
  schedule:
    interval: "weekly"
    day: "wednesday"
    time: "09:30"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "go"
  - "cli"
  commit-message:
    prefix: "deps(cli)"
  pull-request-branch-name:
    separator: "-"

# === Go Dependencies - Device Client ===
- package-ecosystem: "gomod"
  directory: "/client/client"
  schedule:
    interval: "weekly"
    day: "wednesday"
    time: "10:00"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "go"
  - "client"
  commit-message:
    prefix: "deps(client)"
  pull-request-branch-name:
    separator: "-"

# === Go Dependencies - Cocoon Portal ===
- package-ecosystem: "gomod"
  directory: "/cocoon/portal"
  schedule:
    interval: "weekly"
    day: "wednesday"
    time: "10:30"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "go"
  - "cocoon"
  commit-message:
    prefix: "deps(cocoon)"
  pull-request-branch-name:
    separator: "-"

# === Go Dependencies - Shared Libraries ===
- package-ecosystem: "gomod"
  directory: "/common/shared"
  schedule:
    interval: "weekly"
    day: "wednesday"
    time: "11:00"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "go"
  - "shared"
  commit-message:
    prefix: "deps(shared)"
  pull-request-branch-name:
    separator: "-"

# === Node.js Dependencies - Web UI (Svelte Frontend) ===
- package-ecosystem: "npm"
  directory: "/ui/web"
  schedule:
    interval: "weekly"
    day: "thursday"
    time: "09:00"
    timezone: "Etc/UTC"
  open-pull-requests-limit: 15
  labels:
  - "dependencies"
  - "npm"
  - "frontend"
  commit-message:
    prefix: "deps(web)"
  pull-request-branch-name:
    separator: "-"
  groups:
    svelte-ecosystem:
      patterns:
      - "@sveltejs/*"
      - "svelte*"
    vite-ecosystem:
      patterns:
      - "vite*"
      - "@vitejs/*"
    dev-dependencies:
      dependency-type: "development"
      update-types:
      - "minor"
      - "patch"
