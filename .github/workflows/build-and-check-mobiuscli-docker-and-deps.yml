---
# DISABLED: Requires Makefile targets (wix-docker, bomutils-docker, mobiuscli-docker) that don't exist yet
name: Build mobiuscli container dependencies and check vulnerabilities

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id}}
  cancel-in-progress: true

defaults:
  run:
    # fail-fast using bash -eo pipefail. See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions  # exit-codes-and-error-action-preference
    shell: bash

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-22.04
    permissions:
      packages: write
      contents: write
      actions: write
      id-token: write # for aws-actions/configure-aws-credentials
    steps:
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "server/cli/go.mod"

      - name: Build ghcr.io/notawar/wix
        run: make wix-docker

      - name: Build ghcr.io/notawar/bomutils
        run: make bomutils-docker

      - name: Build ghcr.io/notawar/mobiuscli
        run: make mobiuscli-docker

      - name: List VEX files
        id: generate_vex_files
        run: |
          if [ -d "./security/vex/mobiuscli/" ] && [ -n "$(ls -A ./security/vex/mobiuscli/)" ]; then
            VEX_FILES=$(ls -1 ./security/vex/mobiuscli/ | while IFS= read -r line; do echo "./security/vex/mobiuscli/$line"; done | tr '\n' ',' | sed 's/.$//')
            echo "Found VEX files: $VEX_FILES"
            echo "VEX_FILES=$VEX_FILES" >> $GITHUB_OUTPUT
          else
            echo "No VEX files found in ./security/vex/mobiuscli/, skipping VEX validation"
            echo "VEX_FILES=" >> $GITHUB_OUTPUT
          fi

      - name: Run Trivy vulnerability scanner on ghcr.io/notawar/mobius-cli
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        run: |
          mkdir trivy-download
          cd trivy-download
          curl -L https://github.com/aquasecurity/trivy/releases/download/v0.61.0/trivy_0.61.0_Linux-64bit.tar.gz --output trivy_0.61.0_Linux-64bit.tar.gz
          tar -xf trivy_0.61.0_Linux-64bit.tar.gz
          mv trivy ..
          cd ..
          chmod +x ./trivy
          ./trivy image \
            --exit-code=1 \
            --ignore-unfixed \
            --pkg-types=os,library \
            --severity=HIGH,CRITICAL \
            --vex="${{ steps.generate_vex_files.outputs.VEX_FILES }}" \
            ghcr.io/notawar/mobius-cli

      - name: Run Trivy vulnerability scanner on ghcr.io/notawar/wix
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # 0.32.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        with:
          image-ref: "ghcr.io/notawar/wix"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Run Trivy vulnerability scanner on ghcr.io/notawar/bomutils
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # 0.32.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        with:
          image-ref: "ghcr.io/notawar/bomutils"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"


