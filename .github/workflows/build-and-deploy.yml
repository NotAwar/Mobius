---
name: Build and Deploy Mobius

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Validate Score specifications
  validate-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install score-compose
        run: |
          # Install score-compose from GitHub releases
          SCORE_VERSION="0.29.6"
          wget "https://github.com/score-spec/score-compose/releases/download/${SCORE_VERSION}/score-compose_${SCORE_VERSION}_linux_amd64.tar.gz"
          tar -xzf "score-compose_${SCORE_VERSION}_linux_amd64.tar.gz"
          sudo mv score-compose /usr/local/bin/
          sudo chmod +x /usr/local/bin/score-compose
          score-compose --version

      - name: Validate all Score specifications
        run: |
          echo "Validating Score specifications..."
          
          # Initialize score-compose in the repository root
          score-compose init
          
          # Find all score.yaml files
          SCORE_FILES=$(find . -name "score.yaml" -not -path "*/node_modules/*" -not -path "*/.git/*")
          
          EXIT_CODE=0
          for score_file in $SCORE_FILES; do
            echo "----------------------------------------"
            echo "Validating: $score_file"
            
            # Validate the Score spec structure (no --build needed for validation)
            CLEAN_PATH="${score_file#./}"
            
            if score-compose generate "$score_file" --output "generated-${CLEAN_PATH//\//-}.yaml" 2>&1; then
              echo "✅ Valid Score specification: $score_file"
            else
              echo "❌ Invalid Score specification: $score_file"
              EXIT_CODE=1
            fi
          done
          
          # Show generated compose files
          if [ -f docker-compose.yaml ]; then
            echo "----------------------------------------"
            echo "Generated Docker Compose preview:"
            head -n 30 docker-compose.yaml
          fi
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "----------------------------------------"
            echo "✅ All Score specifications are valid"
          else
            echo "----------------------------------------"
            echo "❌ Some Score specifications failed validation"
            exit 1
          fi

      - name: Upload Score validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-validation-results
          path: |
            docker-compose.yaml
            generated-*.yaml
            .score-compose/
          retention-days: 7

  # Test and Build
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true
          cache-dependency-path: |
            go.work.sum
            server/api/go.sum
            server/cli/go.sum
            client/client/go.sum
            cocoon/portal/go.sum
            common/shared/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/web/package-lock.json

      - name: Sync workspace and download dependencies
        shell: bash
        run: |
          set -euo pipefail
          go work sync
          # Use parallel downloads on Windows to speed up module fetching
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export GOPROXY="https://proxy.golang.org,direct"
            export GOSUMDB="sum.golang.org"
            export GOMAXPROCS=4
          fi
          (cd server/api && go mod download)
          (cd server/cli && go mod download)
          (cd client/client && go mod download)
          (cd cocoon/portal && go mod download)
          (cd common/shared && go mod download)

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd ui/web
          npm ci

      - name: Build frontend
        shell: bash
        run: |
          cd ui/web
          npm run build

      - name: Run frontend tests
        shell: bash
        run: |
          cd ui/web
          npm test

      - name: Run Go tests (all modules)
        shell: bash
        run: |
          set -euo pipefail
          echo "Running Go tests..."
          # Windows-specific optimizations
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export GOMAXPROCS=4
            export GOCACHE="$(go env GOCACHE)"
          fi
          # Test with minimal output, only show results for packages with actual tests
          go test -short -count=1 ./server/api/... ./server/cli/... \
            ./client/client/... ./cocoon/portal/... ./common/shared/... | \
            grep -v "\[no test files\]" || echo "Tests completed (no test failures)"

      - name: Build binaries sanity (server and CLI)
        shell: bash
        run: |
          set -euo pipefail
          # Copy frontend build to server
          mkdir -p server/api/static
          cp -r ui/web/build/* server/api/static/ || \
            echo "No frontend build to copy"
          # Windows-specific build optimizations
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export GOMAXPROCS=4
            export CGO_ENABLED=0
          fi
          (cd server/api && go build ./cmd/api-server)
          (cd server/cli && go build ./cmd/mobiuscli)

  # Build Docker Images
  build:
    needs: [test, validate-score]
    permissions:
      contents: write      # For release asset uploads and SBOM attachment
      packages: write
      id-token: write      # For Sigstore OIDC signing
      attestations: write  # For SBOM attestations
    strategy:
      fail-fast: false      # Don't cancel other builds if one fails
      max-parallel: 1       # Reduce to 1 to give more resources to each build
      matrix:
        component: [server, cli, client, cocoon]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Show build context info
        shell: bash
        run: |
          echo "Building component: ${{ matrix.component }}"
          echo "Available CPU cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 'unknown')"
          echo "Available memory: $(free -h 2>/dev/null || echo 'Memory info not available')"
          echo "Disk space: $(df -h . 2>/dev/null || echo 'Disk info not available')"

      - name: Normalize image name to lowercase (GHCR requirement)
        id: imagename
        shell: bash
        run: |
          set -euo pipefail
          lower=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "lower=${lower}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine component path
        id: componentpath
        shell: bash
        run: |
          case "${{ matrix.component }}" in
            server)
              echo "path=server/api" >> "$GITHUB_OUTPUT"
              ;;
            cli)
              echo "path=server/cli" >> "$GITHUB_OUTPUT"
              ;;
            client)
              echo "path=client/client" >> "$GITHUB_OUTPUT"
              ;;
            cocoon)
              echo "path=cocoon/portal" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown component: ${{ matrix.component }}"
              exit 1
              ;;
          esac

      - name: Show Go build context (CLI only)
        if: matrix.component == 'cli'
        working-directory: ./${{ steps.componentpath.outputs.path }}
        shell: bash
        run: |
          set +e  # Don't exit on non-zero exit codes for this step
          echo "=== Go build context for ${{ matrix.component }} ==="
          go version
          echo "Go cache directory: $(go env GOCACHE)"
          echo "Go module cache: $(go env GOMODCACHE)"
          echo "Module dependencies (first 20):"
          go list -m all | sed 20q 2>/dev/null || echo "Could not list dependencies"
          DEPS_COUNT=$(go list -m all 2>/dev/null | wc -l || echo "0")
          echo "Direct dependencies count: $DEPS_COUNT"
          echo "=== End build context ==="
          set -e  # Re-enable strict error handling

      - name: Pre-build Go modules cache (CLI only)
        if: matrix.component == 'cli'
        working-directory: ./${{ steps.componentpath.outputs.path }}
        shell: bash
        run: |
          set +e  # Don't exit on non-zero exit codes for this step
          echo "Pre-downloading Go modules..."
          if command -v time >/dev/null 2>&1; then
            time go mod download -x 2>/dev/null || go mod download
          else
            go mod download -x 2>/dev/null || go mod download
          fi
          echo "Module download complete"
          set -e  # Re-enable strict error handling

      - name: Log in to Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.component }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lower }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push ${{ matrix.component }} Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ steps.componentpath.outputs.path }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add verbose output for CLI builds
          build-args: |
            ${{ matrix.component == 'cli' && 'VERBOSE=1' || '' }}
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: >-
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lower }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'
      - name: Sign image (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.imagename.outputs.lower }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}"
          # Retry signing up to 3 times in case of token expiration
          for i in {1..3}; do
            if cosign sign --yes "$IMAGE"; then
              echo "Successfully signed image on attempt $i"
              break
            else
              echo "Signing attempt $i failed, retrying..."
              sleep 10
            fi
          done

  # Create Release
  release:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'release'
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/web/package-lock.json

      - name: Build frontend
        run: |
          cd ui/web
          npm ci
          npm run build

      - name: Copy frontend to server
        run: |
          mkdir -p server/api/static
          cp -r ui/web/build/* server/api/static/

      - name: Build server release binaries
        run: |
          cd server/api
          GOOS=linux GOARCH=amd64 go build -o mobius-api-linux-amd64 ./cmd/api-server
          GOOS=linux GOARCH=arm64 go build -o mobius-api-linux-arm64 ./cmd/api-server
          GOOS=darwin GOARCH=amd64 go build -o mobius-api-darwin-amd64 ./cmd/api-server
          GOOS=darwin GOARCH=arm64 go build -o mobius-api-darwin-arm64 ./cmd/api-server
          GOOS=windows GOARCH=amd64 go build -o mobius-api-windows-amd64.exe ./cmd/api-server

      - name: Build CLI release binaries
        run: |
          cd server/cli
          GOOS=linux GOARCH=amd64 go build -o mobiuscli-linux-amd64 ./cmd/mobiuscli
          GOOS=linux GOARCH=arm64 go build -o mobiuscli-linux-arm64 ./cmd/mobiuscli
          GOOS=darwin GOARCH=amd64 go build -o mobiuscli-darwin-amd64 ./cmd/mobiuscli
          GOOS=darwin GOARCH=arm64 go build -o mobiuscli-darwin-arm64 ./cmd/mobiuscli
          GOOS=windows GOARCH=amd64 go build -o mobiuscli-windows-amd64.exe ./cmd/mobiuscli

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            server/api/mobius-api-*
            server/cli/mobiuscli-*
            sbom-*.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
