---
# DISABLED: Requires published container images at ghcr.io/NotAwar/mobius-*
name: Check critical vulnerabilities in released GitHub Package images

on:
  workflow_dispatch:
  pull_request:
  # schedule:
  #   - cron: "0 6 * * *"

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id}}
  cancel-in-progress: true

defaults:
  run:
    # fail-fast using bash -eo pipefail. See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions  # exit-codes-and-error-action-preference
    shell: bash

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-22.04
    permissions:
      packages: read
    steps:


      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "server/api/go.mod"

      - name: Get last 5 minor releases
        id: get_latest_releases
        run: |
          echo "MOBIUS_LATEST_RELEASES=$(cd server/api && go run ./tools/github-releases --last-minor-releases 5)" >> $GITHUB_OUTPUT

      - name: Pull container images
        run: |
          RELEASES="${{ steps.get_latest_releases.outputs.MOBIUS_LATEST_RELEASES }}"
          for version in $RELEASES; do
            docker pull ghcr.io/notawar/mobius-server:$version
          done

      - name: List mobius VEX files
        id: generate_mobius_vex_files
        run: |
          if [ -d "./security/vex/mobius/" ] && [ -n "$(ls -A ./security/vex/mobius/)" ]; then
            VEX_FILES=$(ls -1 ./security/vex/mobius/ | while IFS= read -r line; do echo "./security/vex/mobius/$line"; done | tr '\n' ',' | sed 's/.$//')
            echo "Found VEX files: $VEX_FILES"
            echo "MOBIUS_VEX_FILES=$VEX_FILES" >> $GITHUB_OUTPUT
          else
            echo "No VEX files found in ./security/vex/mobius/, skipping VEX validation"
            echo "MOBIUS_VEX_FILES=" >> $GITHUB_OUTPUT
          fi

      # We use the trivy command and not the github action because it doesn't support loading
      # VEX files yet and looks like we can't run the action on multiple images.
      - name: Run trivy vulnerability scanner on ghcr.io/notawar/mobius-server images
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        run: |
          mkdir trivy-download
          cd trivy-download
          curl -L https://github.com/aquasecurity/trivy/releases/download/v0.61.0/trivy_0.61.0_Linux-64bit.tar.gz --output trivy_0.61.0_Linux-64bit.tar.gz
          tar -xf trivy_0.61.0_Linux-64bit.tar.gz
          mv trivy ..
          cd ..
          chmod +x ./trivy
          RELEASES="${{ steps.get_latest_releases.outputs.MOBIUS_LATEST_RELEASES }}"
          for version in $RELEASES; do
            ./trivy image \
              --exit-code=1 \
              --pkg-types=os,library \
              --severity=CRITICAL \
              --vex="${{ steps.generate_mobius_vex_files.outputs.MOBIUS_VEX_FILES }}" \
              ghcr.io/notawar/mobius-server:$version
          done

      - name: List mobiuscli VEX files
        id: generate_mobiuscli_vex_files
        run: |
          if [ -d "./security/vex/mobiuscli/" ] && [ -n "$(ls -A ./security/vex/mobiuscli/)" ]; then
            VEX_FILES=$(ls -1 ./security/vex/mobiuscli/ | while IFS= read -r line; do echo "./security/vex/mobiuscli/$line"; done | tr '\n' ',' | sed 's/.$//')
            echo "Found VEX files: $VEX_FILES"
            echo "MOBIUSCTL_VEX_FILES=$VEX_FILES" >> $GITHUB_OUTPUT
          else
            echo "No VEX files found in ./security/vex/mobiuscli/, skipping VEX validation"
            echo "MOBIUSCTL_VEX_FILES=" >> $GITHUB_OUTPUT
          fi

      # We use the trivy command and not the github action because it doesn't support loading VEX files yet.
      - name: Run trivy vulnerability scanner on latest released ghcr.io/notawar/mobius-cli image
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        run: |
          ./trivy image \
            --exit-code=1 \
            --pkg-types=os,library \
            --severity=CRITICAL \
            --vex="${{ steps.generate_mobiuscli_vex_files.outputs.MOBIUSCTL_VEX_FILES }}" \
            ghcr.io/notawar/mobius-cli:latest
