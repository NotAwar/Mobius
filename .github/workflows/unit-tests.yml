---
name: Unit Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.work'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.work'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [server/api, server/cli, client/client, cocoon/portal, common/shared]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache-dependency-path: |
            server/api/go.sum
            server/cli/go.sum
            client/client/go.sum
            cocoon/portal/go.sum
            common/shared/go.sum

      - name: Sync workspace and download deps
        run: |
          go work sync
          go env
          # Download deps for all modules to warm the cache
          (cd server/api && go mod download)
          (cd server/cli && go mod download)
          (cd client/client && go mod download)
          (cd cocoon/portal && go mod download)
          (cd common/shared && go mod download)

      - name: Run unit tests (matrix module)
        run: |
          set -euo pipefail
          cd ${{ matrix.module }}
          # Check if there are any Go test files before running tests
          if find . -name '*_test.go' -print -quit | grep -q .; then
            go test -race -count=1 -coverprofile=../coverage-${{ matrix.module }}.out ./...
          else
            echo "No test files found in ${{ matrix.module }}, skipping tests"
            # Create empty coverage file to avoid artifact upload failures
            touch ../coverage-${{ matrix.module }}.out
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: coverage-${{ matrix.module }}.out

  coverage:
    name: Aggregate coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Set up Go (for coverage tooling)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download coverage artifacts
        uses: actions/download-artifact@v5
        with:
          path: coverage

      - name: Merge coverage profiles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(coverage/**/coverage-*.out)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No coverage files found" >&2
            exit 1
          fi
          echo "mode: set" > coverage/coverage-merged.out
          for f in "${files[@]}"; do
            tail -n +2 "$f" >> coverage/coverage-merged.out
          done

      - name: Generate coverage summary
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          export GO111MODULE=on
          go tool cover -func=coverage/coverage-merged.out | tee coverage/coverage.txt
          total=$(go tool cover -func=coverage/coverage-merged.out | awk '/total:/ {print $3}')
          {
            echo "# Unit test coverage";
            echo;
            echo "Overall coverage: ${total}";
            echo;
            echo "Details:";
            echo;
            echo '```';
            cat coverage/coverage.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: |
            coverage/coverage-merged.out
            coverage/coverage.txt
