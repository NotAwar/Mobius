---
name: Unit Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.work'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.work'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [server/api, server/cli, client/client, cocoon/portal, common/shared]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache-dependency-path: |
            server/api/go.sum
            server/cli/go.sum
            client/client/go.sum
            cocoon/portal/go.sum
            common/shared/go.sum

      - name: Sync workspace and download deps
        run: |
          go work sync
          go env
          # Download deps for all modules to warm the cache
          (cd server/api && go mod download)
          (cd server/cli && go mod download)
          (cd client/client && go mod download)
          (cd cocoon/portal && go mod download)
          (cd common/shared && go mod download)

      - name: Run unit tests (matrix module)
        run: |
          # Create coverage filename by replacing / with -
          COVERAGE_FILE="coverage-$(echo '${{ matrix.module }}' | tr '/' '-').out"
          WORKSPACE_ROOT="${GITHUB_WORKSPACE}"
          COVERAGE_PATH="${WORKSPACE_ROOT}/${COVERAGE_FILE}"
          
          echo "Workspace root: $WORKSPACE_ROOT"
          echo "Coverage file will be: $COVERAGE_PATH"
          
          # Check if any test files exist first
          cd ${{ matrix.module }}
          TEST_FILES=$(find . -name '*_test.go' -type f 2>/dev/null || true)
          if [ -z "$TEST_FILES" ]; then
            echo "No test files found in ${{ matrix.module }} - creating empty coverage file"
            touch "$COVERAGE_PATH"
            echo "Created empty coverage file at: $COVERAGE_PATH"
            ls -la "$COVERAGE_PATH"
            exit 0
          fi
          # Run tests with race detector
          echo "Running tests in ${{ matrix.module }}"
          go test -race -count=1 -coverprofile="$COVERAGE_PATH" ./...
          
          echo "Test complete. Coverage file:"
          ls -la "$COVERAGE_PATH" || echo "ERROR: Coverage file not found at $COVERAGE_PATH"

      - name: Set coverage filename
        id: coverage
        run: |
          SANITIZED_MODULE=$(echo '${{ matrix.module }}' | tr '/' '-')
          COVERAGE_FILE="coverage-${SANITIZED_MODULE}.out"
          WORKSPACE_ROOT="${GITHUB_WORKSPACE}"
          COVERAGE_PATH="${WORKSPACE_ROOT}/${COVERAGE_FILE}"
          
          echo "filename=$COVERAGE_FILE" >> $GITHUB_OUTPUT
          echo "artifact_name=coverage-${SANITIZED_MODULE}" >> $GITHUB_OUTPUT
          
          # Debug: Verify file exists before upload
          echo "Workspace root: $WORKSPACE_ROOT"
          echo "Looking for coverage file: $COVERAGE_PATH"
          if [ -f "$COVERAGE_PATH" ]; then
            echo "✓ Coverage file found:"
            ls -lh "$COVERAGE_PATH"
          else
            echo "✗ Coverage file NOT found at: $COVERAGE_PATH"
            echo "Contents of workspace root:"
            ls -la "$WORKSPACE_ROOT" | grep coverage || echo "No coverage files found"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.coverage.outputs.artifact_name }}
          path: ${{ steps.coverage.outputs.filename }}
          if-no-files-found: error

  coverage:
    name: Aggregate coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go (for coverage tooling)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download coverage artifacts
        uses: actions/download-artifact@v5
        with:
          path: coverage

      - name: Merge coverage profiles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(coverage/**/coverage-*.out)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No coverage files found" >&2
            exit 1
          fi
          echo "mode: set" > coverage/coverage-merged.out
          for f in "${files[@]}"; do
            tail -n +2 "$f" >> coverage/coverage-merged.out
          done

      - name: Generate coverage summary
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          # Use workspace mode to resolve package paths in coverage files
          go tool cover -func=coverage/coverage-merged.out | tee coverage/coverage.txt
          total=$(go tool cover -func=coverage/coverage-merged.out | awk '/total:/ {print $3}')
          {
            echo "# Unit test coverage";
            echo;
            echo "Overall coverage: ${total}";
            echo;
            echo "Details:";
            echo;
            echo '```';
            cat coverage/coverage.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: |
            coverage/coverage-merged.out
            coverage/coverage.txt
