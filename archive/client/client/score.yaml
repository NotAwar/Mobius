apiVersion: score.dev/v1b1
metadata:
  name: mobius-client
  description: Mobius Device Client Agent

containers:
  client:
    image: .
    variables:
      MOBIUS_API_URL: "${resources.api.url}"
      MOBIUS_DEVICE_ID: "${DEVICE_ID}"
      MOBIUS_ENROLLMENT_TOKEN: "${ENROLLMENT_TOKEN}"
      MOBIUS_LOG_LEVEL: "info"

resources:
  api:
    type: service
    params:
      host: mobius-api
      port: 8081
