apiVersion: score.dev/v1b1
metadata:
  name: mobius-cocoon
  description: Mobius Enterprise Portal

containers:
  portal:
    image: .
    variables:
      MOBIUS_API_URL: "${resources.api.url}"
      MOBIUS_COCOON_PORT: "8082"
      MOBIUS_LOGGING_JSON: "true"

service:
  ports:
    portal:
      port: 8082
      targetPort: 8082
      protocol: TCP

resources:
  api:
    type: service
    params:
      host: mobius-api
      port: 8081
  dns:
    type: dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      path: /
      port: 8082
