---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mobius-osquery
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  bootstrap:
    initdb:
      database: mobius_osquery
      owner: mobius_osquery
      secret:
        name: mobius-osquery-credentials

  storage:
    size: 50Gi # Larger storage for telemetry data
    storageClass: standard

  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "64MB"
      maintenance_work_mem: "256MB"
      log_statement: "none" # Reduce logging for high-volume inserts
      log_duration: "off"
---
apiVersion: v1
kind: Secret
metadata:
  name: mobius-osquery-credentials
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: mobius_osquery
  password: changeme-osquery-password
